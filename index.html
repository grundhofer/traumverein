<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRAUMVEREIN – Der Fußballmanager</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/screens.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1c4a22">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚽</text></svg>">
</head>
<body>
  <div id="app">
    <div class="tv-lade" id="tv-boot">TRAUMVEREIN wird geladen …</div>
  </div>
  <div id="tv-toasts"></div>

  <script>
    // Offline lauffähig und installierbar machen. Nur über http(s): Aus einer
    // lokalen Datei gibt es keine Service Worker, und die Einzeldatei aus dem
    // Release braucht auch keine – sie trägt alles schon in sich.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          // Kein Grund, den Start zu verhindern – das Spiel läuft auch ohne.
          console.warn('[start] Offline-Fassung nicht eingerichtet:', err);
        });
      });
    }
  </script>

  <script type="module">
    import { boot } from './src/main.js';
    boot(document.getElementById('app')).catch(err => {
      console.error(err);
      const app = document.getElementById('app');
      app.innerHTML = '';
      const box = document.createElement('div');
      box.style.cssText = 'padding:32px;color:#f2e8cf;font-family:sans-serif;line-height:1.6';
      box.innerHTML = '<h1 style="color:#e04b4b">Startfehler</h1>' +
        '<p>Das Spiel konnte nicht geladen werden.</p>' +
        '<pre style="background:rgba(0,0,0,.4);padding:12px;overflow:auto;white-space:pre-wrap">' +
        String(err && err.stack || err).replace(/</g, '&lt;') + '</pre>' +
        hinweis();
      // Der Rat hängt daran, woher diese Seite kam. Über file:// ist die Ursache
      // immer dieselbe; auf einem Server ist es nie der fehlende Server.
      function hinweis() {
        if (location.protocol === 'file:') {
          return '<p style="opacity:.7">Das Spiel liegt hier als Datei im Dateisystem. ' +
            'ES-Module laden der Browser über <code>file://</code> grundsätzlich nicht — ' +
            'das ist kein Fehler dieses Spiels, sondern eine Sicherheitsregel des Browsers.<br>' +
            'Zwei Wege: online spielen unter ' +
            '<a style="color:#e8c33a" href="https://grundhofer.github.io/traumverein/">grundhofer.github.io/traumverein</a>, ' +
            'oder im Projektordner <code>npm start</code> (bzw. <code>node tools/server.js</code>) ' +
            'starten und <code>http://localhost:8123</code> öffnen.</p>';
        }
        return '<p style="opacity:.7">Ein Modul konnte nicht geladen werden. Wenn Sie gerade ' +
          'Dateien geändert haben: Der Browser hält vermutlich einen veralteten Stand. ' +
          'Einmal hart neu laden (<code>Strg</code>/<code>Cmd</code> + <code>Umschalt</code> + <code>R</code>) ' +
          'räumt das aus.<br>Für die Entwicklung <code>npm start</code> benutzen — ' +
          '<code>python3 -m http.server</code> schickt keine Cache-Vorgaben und liefert dann ' +
          'veraltete Module aus, was oben wie ein Programmierfehler aussieht. Die Begründung ' +
          'steht im Kopf von <code>tools/server.js</code>.</p>';
      }
      app.appendChild(box);
    });
  </script>
</body>
</html>
